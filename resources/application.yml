spring:
  application:
    name: kotlin-pg-api

  datasource:
    url: jdbc:postgresql://localhost:5432/api_db
    username: postgres
    password: 123qwe
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    com.exemplo.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

api:
  version: 1.0.0
  title: Kotlin API
