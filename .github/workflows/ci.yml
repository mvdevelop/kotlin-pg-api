# ============================================================================
# GitHub Actions CI/CD Pipeline — Kotlin Product API
# ----------------------------------------------------------------------------
# SECURITY PIPELINE STAGES:
# 1. Build + Unit Tests
# 2. SAST — Semgrep (static analysis)
# 3. Dependency Scan — OWASP Dependency-Check
# 4. Docker Build + Scan — Trivy container vulnerability scan
# 5. Integration Tests — Testcontainers
#
# OWASP ASVS 4.0.3 — V1.5.1: Verify that the application build process
# includes security testing (SAST, DAST, dependency scanning)
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, 'portfolio/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write  # Needed for container registry
  security-events: write  # Needed for CodeQL/code scanning alerts

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # 1. Build & Unit Tests
  # ==========================================================================
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-pass-123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set up .env file for tests
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" > .env.test
          echo "DB_PASSWORD=test-pass-123" >> .env.test
          echo "REDIS_PASSWORD=test-pass-123" >> .env.test

      - name: Build with Maven
        run: mvn -B clean compile --no-transfer-progress

      - name: Run Unit Tests
        run: mvn test -B --no-transfer-progress -Dtest='*Test'

      - name: Run Integration Tests
        run: mvn verify -B --no-transfer-progress -Dit*'IT'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports

  # ==========================================================================
  # 2. SAST — Semgrep Static Analysis
  # ==========================================================================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate line tracking

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/gradle
            r/python.cve
          generate-pipeline-config: true
          send-tripwire: false
          timeout: 300

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: failure()
        with:
          sarif_file: semgrep.sarif
          checkout_path: .

  # ==========================================================================
  # 3. SAST — CodeQL (GitHub's official static analysis engine)
  # ==========================================================================
  codeql-analysis:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "CodeQL: Java/Kotlin"

  # ==========================================================================
  # 4. Dependency Vulnerability Scan — OWASP Dependency-Check
  # ==========================================================================
  dependency-check:
    name: Dependency Vulnerability Scan — OWASP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-owasp-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-owasp-

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'kotlin-pg-api'
          path: '.'
          format: 'HTML'
          out: 'reports'
          enableExperimental: 'true'
          failOnCVSS: '7'  # Fail on HIGH (CVSS >= 7.0) and CRITICAL
          suppressionFile: 'dependency-check-suppressions.xml'
          assembly: true

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: warn

  # ==========================================================================
  # 5. Build & Scan Docker Image — Trivy Container Scan
  # ==========================================================================
  docker-build-and-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'alpine:3.19'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================================================
  # 6. DAST — OWASP ZAP Security Scan (on deployed test instance)
  # ==========================================================================
