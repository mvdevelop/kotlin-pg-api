  #         target: 'http://localhost:8080'
  #         cmd_options: '-a -s xss,sqli'
  #         fail_action: true

  # ==========================================================================
  # 7. Deploy
  # ==========================================================================
  # NOTE: Deploy only on pushes to main. Requires secrets:
  # - DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (or GHCR)
  # - KUBE_CONFIG / SSH_KEY (for Kubernetes/VM deployment)
